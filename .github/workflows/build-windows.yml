name: Build (Windows)

on:
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  build:
    name: Build & Publish (Windows)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: 🧰 Install OpenSSL
        run: choco install -y --no-progress openssl

      - name: 🐍 Install uv & Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: 🏗️ Build Executable (onedir)
        env:
          PYTHONIOENCODING: utf-8
          UV_PROJECT_ENVIRONMENT: .venv
        run: |
          uv sync --all-extras --all-groups
          uv run python -m build -w
          uv run python setup_pyi.py

      - name: 🧪 Test Executable
        run: |
          .\dist\lncrawl\lncrawl.exe -ll sources list
          .\dist\lncrawl\lncrawl.exe -ll crawl 'https://novelfull.com/dungeon-defense.html' --first 2 --format epub --noin

      - name: 📦 Build Installer
        run: |
          $version = (Get-Content "lncrawl/VERSION").Trim()
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "installer\installer.iss" `
            "/DMyAppVersion=$version"

      - name: 📦 Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: lncrawl-windows
          path: dist/lncrawl.exe
          retention-days: 7

      - name: 🚀 Release Artifact
        if: ${{ github.event_name == 'workflow_call' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/lncrawl.exe"
          allowUpdates: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}
