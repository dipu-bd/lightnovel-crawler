name: Build and Publish
run-name: "Release ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/lint.yml
    with:
      run_crawl_test: true
    permissions:
      contents: read

  sync-web:
    uses: ./.github/workflows/web.yml
    permissions:
      contents: write
    secrets: inherit

  create-release:
    name: Create GitHub Release
    needs: [validate, sync-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: 🏷️ Extract changelog
        id: changelog
        run: |
          version=$(head -n 1 lncrawl/VERSION)
          body=$(awk "/^## \[$version\]/{p=1; next} /^## \[/{if(p) exit} p" CHANGELOG.md)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 🚀 Create draft release
        uses: ncipollo/release-action@v1
        with:
          body: ${{ steps.changelog.outputs.body }}
          draft: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    needs: [validate, sync-web]
    uses: ./.github/workflows/build-docker.yml
    permissions:
      contents: read
      packages: write

  build-windows:
    needs: [create-release]
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: write
    secrets: inherit

  build-mac:
    needs: [create-release]
    uses: ./.github/workflows/build-mac.yml
    permissions:
      contents: write
    secrets: inherit

  build-linux:
    needs: [create-release]
    uses: ./.github/workflows/build-linux.yml
    permissions:
      contents: write
    secrets: inherit

  publish-release:
    name: Publish GitHub Release
    needs: [build-docker, build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🚀 Publish release
        uses: ncipollo/release-action@v1
        with:
          draft: false
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
