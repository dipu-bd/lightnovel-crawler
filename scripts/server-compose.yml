x-torproxy: &torproxy
  image: sdipu/tor-proxy:latest
  restart: unless-stopped
  environment:
    SOCKS_HOST: 0.0.0.0
    CONTROL_HOST: 0.0.0.0
    CONTROL_PASSWORD: "secret"
    SOCKS_POLICY: accept *
  deploy:
    resources:
      limits:
        cpus: "0.25"
        memory: "128M"

services:
  server:
    image: ghcr.io/lncrawl/lightnovel-crawler:latest
    init: true
    ports:
      - "23457:8080"
    command: -ll server -p 8080
    restart: unless-stopped
    environment:
      - LNCRAWL_DATA_PATH=/data
      - DATABASE_URL=postgresql+psycopg://pguser:pgpass@postgres:5432/lncrawl
      - PROXY_URLS=tor;torproxy-1;9150;9151;secret,tor;torproxy-2;9150;9151;secret,tor;torproxy-3;9150;9151;secret
    volumes:
      - ./appdata:/data
    labels:
      - autoheal=true
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - |
          import sys, urllib.request;
          r = urllib.request.urlopen('http://localhost:8080/health', timeout=10);
          sys.exit(0 if r.status==200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "3.50"
          memory: "4G"

  calibre-api:
    image: ghcr.io/lncrawl/ebook-convert-api:v0.2.0
    restart: unless-stopped
    environment:
      MAX_UPLOAD_MB: "100"
      MAX_CONCURRENT_JOBS: "3"
      CONVERSION_TIMEOUT_SECONDS: "600"
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 2g
    labels:
      - autoheal=true
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - |
          import sys, urllib.request;
          r = urllib.request.urlopen('http://localhost:8000/health', timeout=10);
          sys.exit(0 if r.status==200 else 1)

  postgres:
    image: postgres:alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: lncrawl
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpass
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: "512M"

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 90
    deploy:
      resources:
        limits:
          memory: "64M"

  torproxy-1:
    <<: *torproxy

  torproxy-2:
    <<: *torproxy

  torproxy-3:
    <<: *torproxy
